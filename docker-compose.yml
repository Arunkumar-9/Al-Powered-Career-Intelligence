services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  server:
    build: ./server
    restart: unless-stopped
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/aiCareerGuidance
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your environment}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      ADZUNA_APP_ID: ${ADZUNA_APP_ID:-}
      ADZUNA_APP_KEY: ${ADZUNA_APP_KEY:-}
      ADZUNA_COUNTRY: ${ADZUNA_COUNTRY:-in}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:8080}
    depends_on:
      - mongo
    ports:
      - "5000:5000"
    volumes:
      - resume_uploads:/app/uploads

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "8080:80"

volumes:
  mongo_data:
  resume_uploads:
